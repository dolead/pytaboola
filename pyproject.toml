[project]
name = "pytaboola"
version = "0.1.4"
description = "Python client for Taboola API"
authors = [{name = "Antoine Francais", email = "antoine.francais@gmail.com"}]
maintainers = [{name = "Dolead", email = "it@dolead.com"}]
license = "MIT"
readme = "README.md"
keywords = ["taboola", "api"]
requires-python = ">=3.9"
dependencies = ["requests", "python-dateutil"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/dolead/pytaboola"

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = {version = ">=9.0.3,<10", python = ">=3.10"}
isort = {version = "^6.0", python = ">=3.10"}
pycodestyle = "^2.14.0"
black = {version = "^26.3.1", python = ">=3.10"}
flake8 = "^7.3.0"
pylint = {version = "^4.0.5", python = ">=3.10"}
mypy = {version = "^1.19.1", python = ">=3.9"}
types-python-dateutil = {version = "^2.9", python = ">=3.10"}

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["tests.py", "test_*.py", "*_test.py"]

[tool.black]
line-length = 79
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 79

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
